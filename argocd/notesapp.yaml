apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: notesapp
  namespace: argocd

spec:
  project: default
  
  source:
    repoURL: https://github.com/DINA18102002/terraform-ansible.git
    targetRevision: kubernetes-migration
    path: gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true