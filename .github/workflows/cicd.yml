name: GitOps Pipeline

on:
  push:
    branches:
      - kubernetes-migration

    paths-ignore:
      - 'gitops/**'

jobs:

  build-and-update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      
      # ----------------------------------
      # Checkout the code
      # ----------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      #-----------------------------------
      # Set Git Remote
      #-----------------------------------
      - name: Set Git Remote
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      # ----------------------------------
      # Docker Login
      # ----------------------------------
      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------
      # Build Backend Image
      # ----------------------------------
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }} ./fullstackapp/backend

      # ----------------------------------
      # Push Backend Image
      # ----------------------------------
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }}

      # ----------------------------------
      # Build Frontend Image
      # ----------------------------------
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }} ./fullstackapp/frontend

      # ----------------------------------
      # Push Frontend Image
      # ----------------------------------
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }}

      # ----------------------------------
      # Update Backend Manifest
      # ----------------------------------
      - name: Update Backend Manifest
        run: |
          sed -i "s|image: .*notes-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-backend:${{ github.sha }}|g" ./gitops/backend/backend-deployment.yaml

      # ----------------------------------
      # Update Frontend Manifest
      # ----------------------------------
      - name: Update Frontend Manifest
        run: |
          sed -i "s|image: .*notes-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:${{ github.sha }}|g" ./gitops/frontend/frontend-deployment.yaml

      # ----------------------------------
      # Commit Updated Manifests
      # ----------------------------------
      - name: Commit Updated Manifests
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "gitHub-actions"

          git add gitops/

          git commit -m "Update image tags to: ${{ github.sha }}" || echo "No changes"
          git push origin kubernetes-migration