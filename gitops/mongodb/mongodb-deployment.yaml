apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: devops-project

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      nodeSelector:
        role: application
        
      containers:
      - name: mongodb
        image: mongo:7

        resources:
          requests:
            cpu: "10m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 27017

        env:
        - name: MONGO_INITDB_DATABASE
          value: notesapp

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc