apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-project

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
        role: application
        
      containers:
      - name: backend
        image: theena18/notes-backend:7798345a58ed8d91159352e3172965eefedfcea1
        imagePullPolicy: Always

        resources:
          requests:
            cpu: "5m"
            memory: "32Mi"

          limits:
            cpu: "200m"
            memory: "256Mi"

        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URL
          value: "mongodb://mongodb-service:27017/notesdb"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3 