apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: notesapp-ingress
  namespace: devops-project

spec:
  ingressClassName: nginx

  rules:
  - host: notesapp.local

    http:
      paths:

      - path: /notes
        pathType: Prefix

        backend:
          service:
            name: backend-service
            port:
              number: 80

      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend-service
            port:
              number: 80