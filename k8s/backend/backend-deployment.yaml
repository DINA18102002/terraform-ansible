apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-project

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
        role: application
        
      containers:
      - name: backend
        image: theena18/notes-backend:v1
        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URL
          value: "mongodb://mongodb-service:27017/notesdb"