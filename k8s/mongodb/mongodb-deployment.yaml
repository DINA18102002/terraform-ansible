apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: devops-project

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      nodeSelector:
        role: infrastructure
        
      containers:
      - name: mongodb
        image: mongo:7

        ports:
        - containerPort: 27017

        env:
        - name: MONGO_INITDB_DATABASE
          value: notesapp