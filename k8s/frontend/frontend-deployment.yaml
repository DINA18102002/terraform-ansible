apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: devops-project

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend
  
  template:
    metadata:
      labels:
        app: frontend
    
    spec:
      nodeSelector:
        role: application
        
      containers:
      - name: frontend
        image: theena18/notes-frontend:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 80